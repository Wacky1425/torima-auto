name: Torima Auto APK build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Release作成には contents: write が必要。追加PATは不要。
permissions:
  contents: write

# 同時実行による同じバージョンのRelease作成競合を防ぐ。
concurrency:
  group: torima-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: torima-auto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Explain skipped release when signing secrets are not configured
        if: ${{ env.HAS_KEY != 'true' }}
        run: |
          echo 'Signing secrets not configured: debug APK built, public Release not published.'

      - name: Decode signing key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TORIMA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/torima.jks"
          test -s "$RUNNER_TEMP/torima.jks"

      - name: Build signed release APK
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          TORIMA_KEYSTORE: ${{ runner.temp }}/torima.jks
          TORIMA_STORE_PASSWORD: ${{ secrets.TORIMA_STORE_PASSWORD }}
          TORIMA_KEY_ALIAS: ${{ secrets.TORIMA_KEY_ALIAS }}
          TORIMA_KEY_PASSWORD: ${{ secrets.TORIMA_KEY_PASSWORD }}
        run: |
          test -n "$TORIMA_STORE_PASSWORD"
          test -n "$TORIMA_KEY_ALIAS"
          test -n "$TORIMA_KEY_PASSWORD"
          bash ./gradlew :app:assembleRelease --no-daemon

      - name: Upload signed release APK to Actions artifacts
        if: ${{ env.HAS_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: torima-auto-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # ビルド済みの署名付きAPKを *同じ公開リポジトリ* の Releases へ公開。
      # バージョンが同じ場合は既存リリースを上書きせずスキップ。
      - name: Publish GitHub Release in this repository
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump both versionCode and versionName for the next update."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk TorimaAuto-release.apk
          gh release create "$TAG" TorimaAuto-release.apk \
            --target "$GITHUB_SHA" \
            --title "Torima Auto $TAG" \
            --notes "Torima Auto signed APK ($TAG)" \
            --latest
