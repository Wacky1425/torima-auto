name: Android APK build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
      CAN_PUBLISH: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && secrets.TORIMA_DISTRIBUTION_TOKEN != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: torima-auto-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode signing key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
          KEYSTORE_BASE64: ${{ secrets.TORIMA_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/torima.jks"
      - name: Build signed release
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
          TORIMA_KEYSTORE: ${{ runner.temp }}/torima.jks
          TORIMA_STORE_PASSWORD: ${{ secrets.TORIMA_STORE_PASSWORD }}
          TORIMA_KEY_ALIAS: ${{ secrets.TORIMA_KEY_ALIAS }}
          TORIMA_KEY_PASSWORD: ${{ secrets.TORIMA_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease --no-daemon
      - name: Upload signed APK as private Actions artifact
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: torima-auto-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish to public distribution repository
        if: ${{ env.CAN_PUBLISH == 'true' }}
        env:
          CAN_PUBLISH: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && secrets.TORIMA_DISTRIBUTION_TOKEN != '' && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.TORIMA_DISTRIBUTION_TOKEN }}
          GH_REPO: Wacky1425/torima-auto-distribution
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk TorimaAuto-release.apk
          gh release create "v$VERSION" TorimaAuto-release.apk --title "Torima Auto v$VERSION" --notes "Signed APK for Torima Auto" --latest
