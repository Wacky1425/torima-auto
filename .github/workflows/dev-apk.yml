name: Development APK (no release)

# App-specific chats build/test on their own branches. No public Release,
# no update of the stable Torima app, no access to the production signing key.
on:
  push:
    branches:
      - 'dev/**'
      - 'integration/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      module:
        description: "Gradle Android module path, e.g. app or apps:some-slug"
        required: false
        type: string
        default: app

permissions:
  contents: read

concurrency:
  group: dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODULE: ${{ inputs.module || 'app' }}
      HAS_KEY: ${{ secrets.TORIMA_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle with dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test shared API
        run: bash ./gradlew :common:test --no-daemon

      - name: Validate module, build APK and run its unit tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MODULE" =~ ^[A-Za-z][A-Za-z0-9_-]*(:[A-Za-z][A-Za-z0-9_-]*)*$ ]]; then
            echo "::error::Invalid Gradle module path: $MODULE"
            exit 1
          fi
          echo "Build module :$MODULE from $GITHUB_REF"
          bash ./gradlew ":$MODULE:assembleDebug" ":$MODULE:testDebugUnitTest" --no-daemon

      # Optional stable-signature Torima QA app. It installs *alongside*
      # production as com.neru.powlautotest.qa, so repeated tests preserve
      # the separate QA app's image/node learning and settings.
      - name: Decode Torima QA signing key
        if: ${{ env.HAS_KEY == 'true' && env.MODULE == 'app' && github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TORIMA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/torima-qa.jks"
          test -s "$RUNNER_TEMP/torima-qa.jks"

      - name: Build stable-signature Torima QA APK (NOT public release)
        if: ${{ env.HAS_KEY == 'true' && env.MODULE == 'app' && github.event_name != 'pull_request' }}
        env:
          TORIMA_KEYSTORE: ${{ runner.temp }}/torima-qa.jks
          TORIMA_STORE_PASSWORD: ${{ secrets.TORIMA_STORE_PASSWORD }}
          TORIMA_KEY_ALIAS: ${{ secrets.TORIMA_KEY_ALIAS }}
          TORIMA_KEY_PASSWORD: ${{ secrets.TORIMA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TORIMA_STORE_PASSWORD"
          test -n "$TORIMA_KEY_ALIAS"
          test -n "$TORIMA_KEY_PASSWORD"
          bash ./gradlew :app:assembleQa --no-daemon
          test -s app/build/outputs/apk/qa/app-qa.apk
          mkdir -p dev-artifacts
          cp app/build/outputs/apk/qa/app-qa.apk dev-artifacts/TorimaAuto-QA.apk

      - name: Collect only this module's debug APK
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$(printf '%s' "$MODULE" | tr ':' '/')"
          debug_dir="$project_dir/build/outputs/apk/debug"
          test -d "$debug_dir" || { echo "::error::Not found: $debug_dir"; exit 1; }
          apk="$(find "$debug_dir" -maxdepth 1 -type f -name '*.apk' | head -1)"
          test -n "$apk" || { echo "::error::No debug APK found"; exit 1; }
          mkdir -p dev-artifacts
          safe_module="${MODULE//:/-}"
          cp "$apk" "dev-artifacts/${safe_module}-debug.apk"
          echo "Artifact created for $MODULE; this is a DEBUG build, NOT a signed public Release."

      - name: Upload test APK (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: development-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev-artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
